name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reporadar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: reporadar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reporadar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reporadar:ci-only-password@localhost:5432/reporadar_test
      TEST_DATABASE_URL: postgresql://reporadar:ci-only-password@localhost:5432/reporadar_test
      AUTH_SECRET: ci-only-secret-at-least-32-characters-not-for-production
      NEXTAUTH_URL: http://localhost:3100
      DEMO_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:prepare-test
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
